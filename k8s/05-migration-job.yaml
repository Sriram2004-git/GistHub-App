apiVersion: batch/v1
kind: Job
metadata:
  name: gisthub-db-migrate
  namespace: gisthub
  labels:
    app.kubernetes.io/name: database-migration
    app.kubernetes.io/part-of: gisthub
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-migration
        app.kubernetes.io/part-of: gisthub
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:18
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h db -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "Waiting for PostgreSQL service db:5432..."
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: gisthub-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: gisthub-secrets
                  key: POSTGRES_DB
      containers:
        - name: migrate
          image: sr1r22m/gisthub-backend:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - upgrade
            - head
          envFrom:
            - secretRef:
                name: gisthub-secrets
            - configMapRef:
                name: gisthub-config
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
