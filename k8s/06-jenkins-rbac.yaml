apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: gisthub
  labels:
    app.kubernetes.io/part-of: gisthub
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer-role
  namespace: gisthub
rules:
  # Application configuration and services
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # Access only the application Secret
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["gisthub-secrets"]
    verbs: ["get", "update", "patch"]


  # Application workloads
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # Migration Job
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]

  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: ["gisthub-db-migrate"]
    verbs: ["get", "watch", "update", "patch", "delete"]

  # Pod inspection and migration logs
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer-binding
  namespace: gisthub
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: gisthub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-deployer-role
