# Nginx configuration for GistHub React frontend
# -------------------------------------------------
# Listen on port 80 and serve the static React build.
# The `try_files` directive ensures that client‑side routing works
# by falling back to index.html for any unknown path.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets directly
    location /assets/ {
        try_files $uri =404;
    }

    # All other routes – let React Router handle them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: add minimal gzip compression
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
